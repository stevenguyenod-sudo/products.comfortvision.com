<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Comfort Vision &amp; Optik · Products</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --page:#F7F6F2; --card:#FFFFFF; --ink:#1E2433; --slate:#5C6577; --line:#E3E1DA;
  --hero:#16274A; --hero-text:#FFFFFF;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 20px 56px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 14px}
.brand{font-weight:800;font-size:15px;letter-spacing:-.01em;text-decoration:none}
.brand span{color:var(--slate);font-weight:500}
.chip{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--slate)}

.hero{background:var(--hero);color:var(--hero-text);border-radius:20px;padding:30px 26px 28px;margin-top:6px}
.hero .vendor{font-size:13px;font-weight:600;opacity:.75;margin:0 0 8px}
.hero .logo{display:block;height:30px;width:auto;margin:0 0 16px;background:#fff;padding:7px 12px;border-radius:8px;box-sizing:content-box}
.vendor-foot img{height:22px;vertical-align:middle;margin-right:10px}
.flyer-wrap{margin:0 -20px}
.flyer-wrap img{width:100%;display:block}
.flyer-actions{padding:20px 0 8px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.flyer-cta{display:block;text-align:center;background:#16274A;color:#fff;font-weight:800;font-size:15px;padding:14px 20px;border-radius:999px;text-decoration:none}
.flyer-browse{display:block;text-align:center;font-size:14px;font-weight:700;color:var(--slate);text-decoration:none;padding:8px}
.hero h1{font-size:32px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0 0 12px}
.hero .tag{font-size:16px;line-height:1.45;font-weight:500;opacity:.9;margin:0}

.features{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 0}
.feature{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 14px;text-align:center}
.feature svg{width:26px;height:26px;stroke:var(--hero);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feature h3{font-size:13px;font-weight:800;margin:8px 0 4px;line-height:1.2}
.feature p{font-size:12px;line-height:1.45;color:var(--slate);margin:0}
@media (max-width:420px){.features{grid-template-columns:1fr 1fr}.feature:last-child{grid-column:span 2}}


.hero{position:relative;overflow:hidden}
.hero.has-img{padding-bottom:0}
.hero .note{font-family:Georgia,serif;font-style:italic;font-size:15px;opacity:.85;margin:14px 0 0}
.hero img{display:block;width:calc(100% + 52px);margin:22px -26px 0;height:auto}
.hero h1{font-size:30px}
.hero .headline{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px;line-height:1.2}
.options .lead{color:var(--slate);font-size:14px;margin:-8px 0 16px}
.fade-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 8px}
@media (max-width:520px){.fade-grid{grid-template-columns:repeat(2,1fr)}}
.fade{text-align:center}
.lenses{display:flex;justify-content:center;margin-bottom:8px}
.lenses i{display:block;width:34px;height:34px;border-radius:50%;margin-left:-12px;border:1px solid rgba(0,0,0,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.lenses i:first-child{margin-left:0}
.fade h4{font-size:14px;font-weight:800;margin:0}
.fade p{font-size:12px;color:var(--slate);margin:2px 0 0;line-height:1.35}
.split{margin-top:28px;border-radius:16px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;min-height:150px;position:relative;color:#fff}
.split .l{background:#D9DDD4;color:var(--ink);padding:18px}
.split .r{background:#2B3A55;padding:18px}
.split .lab{font-size:12px;font-weight:800;letter-spacing:.02em;margin:0 0 8px}
.split p{font-size:13px;line-height:1.5;margin:0}
.split img{grid-column:1/-1;width:100%;display:block}
.why{margin-top:32px}
.why h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 14px;padding-bottom:8px;border-bottom:2px solid var(--hero)}
.why-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.why-item{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.why-item .ic{flex:none;width:40px;height:40px;border-radius:50%;background:#EAF0F8;display:flex;align-items:center;justify-content:center}
.why-item svg{width:20px;height:20px;stroke:var(--hero);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.why-item h3{font-size:14px;font-weight:800;margin:0 0 2px}
.why-item p{font-size:12px;color:var(--slate);margin:0;line-height:1.4}
.cta{margin-top:28px;padding:20px 22px;border-radius:16px;background:#EAF0F8;border:1px solid #D5E0EF}
.cta h3{font-size:17px;font-weight:800;margin:0 0 6px}
.cta p{font-size:14px;line-height:1.5;color:var(--slate);margin:0 0 14px}
.cta .btn{display:inline-block;background:var(--hero);color:var(--hero-text);font-weight:800;font-size:14px;padding:12px 20px;border-radius:999px}
.vendor-foot{margin-top:26px;font-size:12px;color:var(--slate);letter-spacing:.14em;text-align:center}
.summary{font-size:16px;line-height:1.6;color:var(--ink);margin:26px 0 0;max-width:60ch}

section.options{margin-top:32px}
.options h2{font-size:20px;font-weight:800;letter-spacing:-.01em;margin:0 0 14px}
.opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.opt-grid{grid-template-columns:1fr}}
.opt{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.swatch{flex:none;width:52px;height:52px;border-radius:50%;position:relative;overflow:hidden}
.swatch::before{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,0) 55%)}
.opt h4{font-size:15px;font-weight:800;margin:2px 0 2px}
.opt .t{font-size:13px;font-style:italic;color:var(--slate);margin:0 0 8px}
.opt ul{margin:0;padding-left:16px;font-size:13px;line-height:1.5;color:var(--slate)}

.details{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.details h2{font-size:15px;font-weight:800;margin:0 0 8px}
.details ul{margin:0;padding-left:18px;font-size:14px;line-height:1.7;color:var(--slate)}

.ask{margin-top:28px;padding:20px 22px;border-radius:16px;background:#EAF0F8;border:1px solid #D5E0EF;display:flex;gap:14px;align-items:center}
.ask svg{flex:none;width:28px;height:28px;stroke:var(--hero);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ask p{margin:0;font-size:15px;line-height:1.5;font-weight:600}
.ask small{display:block;font-weight:500;color:var(--slate);font-size:13px;margin-top:2px}

.browse{display:block;margin-top:22px;text-align:center;font-size:14px;font-weight:700;color:var(--slate);text-decoration:none;padding:12px}
.browse:hover{color:var(--ink)}

.catalog h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:18px 0 4px}
.catalog .lead{color:var(--slate);font-size:15px;margin:0 0 22px}
.cat-title{font-size:13px;font-weight:700;color:var(--slate);margin:26px 0 10px}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.cat-grid{grid-template-columns:1fr}}
.card{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card .band{height:64px;padding:14px 16px;display:flex;align-items:flex-end}
.card .band span{font-size:12px;font-weight:600;opacity:.8}
.card .body{padding:12px 16px 16px}
.card h3{font-size:16px;font-weight:800;margin:0 0 4px}
.card p{font-size:13px;color:var(--slate);margin:0 0 10px;line-height:1.4}
.dots{display:flex;gap:5px}
.dots i{width:14px;height:14px;border-radius:50%;display:block}

footer{margin-top:44px;text-align:center;font-size:12px;color:var(--slate)}
footer a{text-decoration:none}
.empty{padding:40px 0;text-align:center;color:var(--slate)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#">Comfort Vision <span>&amp; Optik</span></a>
    <span class="chip" id="chip"></span>
  </header>
  <main id="app"><div class="empty">Loading…</div></main>
  <footer>Comfort Vision &amp; The Optik</footer>
</div>

<script>
const ICONS = {
  bolt:'<svg viewBox="0 0 24 24"><path d="M13 3 4 14h7l-1 7 9-11h-7z"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>',
  palette:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18h1a2 2 0 0 0 2-2v-1a2 2 0 0 1 2-2h1a3 3 0 0 0 3-3c0-5-4-10-9-10z"/><circle cx="7.5" cy="11.5" r="1"/><circle cx="12" cy="7.5" r="1"/><circle cx="16.5" cy="10.5" r="1"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/></svg>',
  feather:'<svg viewBox="0 0 24 24"><path d="M20 4c-5 0-11 3-13 9l-3 7 7-3c6-2 9-8 9-13z"/><path d="M4 20 15 9"/></svg>',
  sparkles:'<svg viewBox="0 0 24 24"><path d="m12 3 1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4m-2-2h4"/></svg>',
  eye:'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  glasses:'<svg viewBox="0 0 24 24"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4M3 14l2-6h3m13 6-2-6h-3"/></svg>',
  gem:'<svg viewBox="0 0 24 24"><path d="M7 4h10l4 5-9 11L3 9z"/><path d="M3 9h18M9 9l3 11 3-11M7 4l2 5m8-5-2 5"/></svg>',
  chat:'<svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg>'
};
const CATS = { lenses:'Lenses', frames:'Frames' };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA = [];

function render(){
  const app = document.getElementById('app');
  const chip = document.getElementById('chip');
  const id = decodeURIComponent(location.hash.replace(/^#/, ''));
  const p = DATA.find(x => x.id === id);
  document.documentElement.style.setProperty('--hero', p?.heroColor || '#16274A');
  document.documentElement.style.setProperty('--hero-text', p?.heroText || '#FFFFFF');
  if (p) { chip.textContent = CATS[p.category] || p.category; app.innerHTML = product(p); document.title = p.name + ' · Comfort Vision & Optik'; }
  else { chip.textContent = 'All products'; app.innerHTML = catalog(); document.title = 'Comfort Vision & Optik · Products'; }
  window.scrollTo(0, 0);
}

function product(p){
  if (p.flyerImage) {
    return `
    <div class="flyer-wrap"><img src="${esc(p.flyerImage)}" alt="${esc(p.name)} product information"></div>
    <div class="flyer-actions">
      <a class="flyer-cta" href="tel:+1-253-277-4998">Ask your optician</a>
      <a class="flyer-browse" href="#">Browse all lenses and frames</a>
    </div>`;
  }
  const fade = p.swatchStyle === 'fade';
  const opts = !p.options?.length ? '' : fade
    ? `<div class="fade-grid">${p.options.map(o => `<div class="fade"><div class="lenses">
        <i style="background:color-mix(in srgb, ${esc(o.hex)} 22%, white)"></i>
        <i style="background:color-mix(in srgb, ${esc(o.hex)} 60%, white)"></i>
        <i style="background:${esc(o.hex)}"></i></div>
        <h4>${esc(o.name)}</h4>${o.tagline ? `<p>${esc(o.tagline)}</p>` : ''}</div>`).join('')}</div>`
    : `<div class="opt-grid">${p.options.map(o => `
    <div class="opt"><div class="swatch" style="background:${esc(o.hex)}"></div><div>
      <h4>${esc(o.name)}</h4>${o.tagline ? `<p class="t">${esc(o.tagline)}</p>` : ''}
      ${o.bullets?.length ? `<ul>${o.bullets.map(b => `<li>${esc(b)}</li>`).join('')}</ul>` : ''}
    </div></div>`).join('')}</div>`;
  const cta = p.cta || { title:`Ask your optician about ${p.name}.`, text:"We'll help you find the right fit for your prescription, lifestyle, and budget." };
  return `
  <div class="hero${p.heroImage ? ' has-img' : ''}">
    ${p.vendorLogo ? `<img class="logo" src="${esc(p.vendorLogo)}" alt="${esc(p.vendor)}">` : `<p class="vendor">${esc(p.vendor)}</p>`}
    <h1>${esc(p.name)}</h1>
    ${p.headline ? `<p class="headline">${esc(p.headline)}</p>` : ''}
    <p class="tag">${esc(p.tagline)}</p>
    ${p.heroNote ? `<p class="note">${esc(p.heroNote)}</p>` : ''}
    ${p.heroImage ? `<img src="${esc(p.heroImage)}" alt="">` : ''}
  </div>
  ${p.features?.length ? `<div class="features">${p.features.map(f => `
    <div class="feature">${ICONS[f.icon] || ICONS.sparkles}<h3>${esc(f.title)}</h3><p>${esc(f.text)}</p></div>`).join('')}</div>` : ''}
  ${p.summary ? `<p class="summary">${esc(p.summary)}</p>` : ''}
  ${opts ? `<section class="options"><h2>${esc(p.optionsTitle || 'Options')}</h2>${p.optionsLead ? `<p class="lead">${esc(p.optionsLead)}</p>` : ''}${opts}</section>` : ''}
  ${p.split ? `<div class="split">${p.split.image ? `<img src="${esc(p.split.image)}" alt="">` : ''}
    <div class="l"><p class="lab">${esc(p.split.leftLabel || 'Clear indoors')}</p></div>
    <div class="r"><p class="lab">${esc(p.split.rightLabel || 'Dark outdoors')}</p><p>${esc(p.split.text || '')}</p></div></div>` : ''}
  ${p.why?.length ? `<section class="why"><h2>${esc(p.whyTitle || 'Why choose it?')}</h2><div class="why-grid">${p.why.map(w => `
    <div class="why-item"><div class="ic">${ICONS[w.icon] || ICONS.sparkles}</div><div><h3>${esc(w.title)}</h3><p>${esc(w.text)}</p></div></div>`).join('')}</div></section>` : ''}
  ${p.details?.length ? `<div class="details"><h2>Good to know</h2><ul>${p.details.map(d => `<li>${esc(d)}</li>`).join('')}</ul></div>` : ''}
  <div class="cta"><h3>${esc(cta.title)}</h3><p>${esc(cta.text)}</p>${cta.button ? `<span class="btn">${esc(cta.button)}</span>` : ''}</div>
  ${p.footerLine ? `<p class="vendor-foot">${p.vendorLogo ? `<img src="${esc(p.vendorLogo)}" alt="${esc(p.vendor)}">` : esc(p.vendor) + ' · '}${esc(p.footerLine)}</p>` : ''}
  <a class="browse" href="#">Browse all lenses and frames</a>`;
}

function catalog(){
  const groups = ['lenses','frames'].filter(c => DATA.some(p => p.category === c));
  return `<div class="catalog"><h1>Our lenses and frames</h1><p class="lead">Scan a code in the office, or browse everything here.</p>
  ${groups.map(c => `<p class="cat-title">${CATS[c]}</p><div class="cat-grid">${DATA.filter(p => p.category === c).map(p => `
    <a class="card" href="#${encodeURIComponent(p.id)}">
      <div class="band" style="background:${esc(p.heroColor)};color:${esc(p.heroText || '#fff')}"><span>${esc(p.vendor)}</span></div>
      <div class="body"><h3>${esc(p.name)}</h3><p>${esc(p.tagline)}</p>
        ${p.options?.length ? `<div class="dots">${p.options.slice(0,8).map(o => `<i style="background:${esc(o.hex)}"></i>`).join('')}</div>` : ''}
      </div></a>`).join('')}</div>`).join('')}</div>`;
}

fetch('products.json', {cache:'no-store'}).then(r => r.json()).then(j => { DATA = j.products || []; render(); })
  .catch(() => { document.getElementById('app').innerHTML = '<div class="empty">Product information isn\'t available right now. Ask a team member for help.</div>'; });
window.addEventListener('hashchange', render);
</script>
</body>
</html>
